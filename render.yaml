services:
  - type: web
    name: butig-care
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT wsgi:app
    disk:
      name: butig-care-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_INVITE_CODE
        sync: false
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/butig_care.db
